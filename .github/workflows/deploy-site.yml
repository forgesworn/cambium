# Deploys site/ to cambium.forgesworn.dev — the shared Hetzner "routing" box,
# same rsync pattern as signet-app's deploy. The Caddy vhost
# (site/deploy/cambium.Caddyfile) is installed on the box separately and is
# excluded from the rsync; this workflow only replaces web content.
#
# Requires the HETZNER_SSH_KEY repository secret (the deploy@62.238.98.53
# private key, as used by signet-app's deploy workflow).
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$HETZNER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host keys for `stall`, the routing host that replaced the retired
          # 95.217.39.110 box after it was cancelled ~2026-08-27. A cancelled address
          # gets reassigned, so the old target was both dead and unsafe to keep
          # pointing an `rsync --delete` at. Never ssh-keyscan per run: TOFU could
          # redirect the rsync, and a failed scan aborts the step under `set -e` with
          # no diagnostic at all, which is how this breakage stayed invisible.
          cat > ~/.ssh/known_hosts <<'EOF'
          62.238.98.53 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINr4gdIzT/1x6isUAmLfoap8d6TPF/3OJjVsjtyhnxx9
          62.238.98.53 ssh-rsa 
          62.238.98.53 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBNlArhQaGuK2A5GeEZ4NT01oTFMc0Dl8S4Um1lJRWmepniOQDEaBrQduoxofjOc5o6bW7w+8KB92A4OAYQU/C1k=
          EOF
          rsync -avz --delete \
            --exclude "deploy/" \
            -e "ssh -i ~/.ssh/deploy_key" \
            site/ deploy@62.238.98.53:/opt/cambium/
