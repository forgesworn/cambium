name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also asks for the long-removed 'tools' package, which the
          # runner image's cmdline-tools 16.0 refuses outright (CI red from 2026-09-24).
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cambium-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # A debug build for manual pickup; nothing downstream consumes it.
          retention-days: 14

  instrumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also asks for the long-removed 'tools' package, which the
          # runner image's cmdline-tools 16.0 refuses outright (CI red from 2026-09-24).
          packages: platform-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare instrumentation APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
          ./gradlew --stop

      - name: Instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            mkdir -p app/build/outputs/androidTest-results
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am force-stop com.android.launcher3
            ./gradlew :app:connectedDebugAndroidTest || { adb shell dumpsys window > app/build/outputs/androidTest-results/failed-window-state.txt; exit 1; }
            ./gradlew --stop
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell wm size 720x1440
            adb shell wm density 360
            adb shell settings put system font_scale 1.5
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am force-stop com.android.launcher3
            adb shell am force-stop dev.forgesworn.cambium.test
            adb shell pm clear dev.forgesworn.cambium
            adb shell am instrument -w -r -e class dev.forgesworn.cambium.ui.UiFlowRegressionTest,dev.forgesworn.cambium.ui.PermissionScopeEditorTest,dev.forgesworn.cambium.ui.DiagnosticsUiTest dev.forgesworn.cambium.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/outputs/androidTest-results/compact-large-text.log
            adb shell dumpsys window > app/build/outputs/androidTest-results/compact-window-state.txt

      - name: Verify compact UI results
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          log = Path('app/build/outputs/androidTest-results/compact-large-text.log').read_text()
          codes = Counter(line.split(': ', 1)[1] for line in log.splitlines()
                          if line.startswith('INSTRUMENTATION_STATUS_CODE:'))
          assert codes == {'1': 16, '0': 16}, f'Incomplete or failed compact UI run: {codes}'
          assert 'OK (16 tests)' in log, 'Missing successful compact UI summary'
          PY

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cambium-android-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
